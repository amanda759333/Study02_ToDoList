<!DOCTYPE html>
<!-- 작성일시: 2026-10-01 11:29 (KST) -->
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 할 일</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <div id="storage-warning" class="warning" role="alert" hidden>저장이 되지 않을 수 있어요</div>

    <header class="app-header">
      <h1>오늘의 할 일</h1>
    </header>

    <section id="progress" class="progress" aria-label="진행률"></section>

    <form id="add-form" class="add-form">
      <label class="visually-hidden" for="todo-input">할 일</label>
      <input id="todo-input" type="text" maxlength="100" placeholder="할 일을 입력하세요" autocomplete="off">
      <label class="visually-hidden" for="category-select">카테고리</label>
      <select id="category-select">
        <option value="work">업무</option>
        <option value="personal">개인</option>
        <option value="study">공부</option>
      </select>
      <button type="submit">추가</button>
    </form>

    <nav id="filters" class="filters" aria-label="카테고리 필터"></nav>

    <ul id="todo-list" class="todo-list"></ul>
    <p id="empty-message" class="empty-message" hidden></p>
  </main>

  <script src="app.js"></script>
</body>
</html>
